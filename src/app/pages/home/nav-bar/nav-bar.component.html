<header class="navbar-container">
  <h1 class="logo">
    <img
      src="https://res.cloudinary.com/dxwcrbqes/image/upload/v1757949941/logo-flash_6_zyawag.png"
      alt="logo"
      class="logo-image"
    />
    FLASH
  </h1>

  <nav class="nav-links">
    <a class="nav-item" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Home
    </a>
    <a class="nav-item" routerLink="/docs" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Docs
    </a>
    <a class="nav-item" routerLink="/faq" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      FAQ
    </a>
    <a class="nav-item" routerLink="/glossaire" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Glossaire
    </a>
  </nav>

  <div class="search-container">
    <!-- CAS 1 : DOCUMENT OUVERT (champ inline dans navbar) -->
    <div *ngIf="isDocContext; else popupMode" class="search-inline">
      <div class="search-input-wrapper-inline">
        <input
          type="text"
          class="search-input-inline"
          placeholder="Rechercher dans ce document..."
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
        />
        <button *ngIf="searchQuery" class="clear-btn-inline" (click)="clearSearch()">✖</button>
      </div>
    </div>

    <!-- CAS 2 : AUTRE PAGE (popup global) -->
    <ng-template #popupMode>
      <button class="search-btn" (click)="openPopup()">🔍</button>

      <div *ngIf="showPopup" class="popup-overlay">
        <div class="search-popup">
          <div class="search-input-wrapper">
            <input
              type="text"
              class="search-input"
              placeholder="🔍 Recherche globale..."
              [(ngModel)]="searchQuery"
              (input)="onSearchChange()"
              autofocus
            />
            <button *ngIf="searchQuery" class="clear-btn" (click)="clearSearch()">✖</button>
          </div>

          <button class="close-btn" (click)="closePopup()">esc</button>

          <div class="search-results" *ngIf="searchQuery">
            <ul *ngIf="filteredDocs.length > 0">
              <li *ngFor="let doc of filteredDocs" (click)="navigateTo(doc.route)">
                <span class="result-title">{{ doc.name }}</span>
                <span class="result-type">Voir</span>
              </li>
            </ul>
            <p *ngIf="filteredDocs.length === 0" class="no-results">Aucun résultat trouvé.</p>
          </div>
        </div>
      </div>
    </ng-template>
  </div>
</header>
